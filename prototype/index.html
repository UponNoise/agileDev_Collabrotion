<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgileDev 交互原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet tool shell. 232px sidebar rail, inset main panel, borderless 36px rows, 300px property rail on detail pages. */
:root{
  --bg:#f6f6f8;--panel:#ffffff;--side:#f6f6f8;--hover:#efeff3;--sel:#ebe9fb;--soft:#f9f9fb;
  --line:#e6e6ec;--line-2:#d5d5de;
  --fg:#16161b;--fg-2:#575864;--fg-3:#8a8b96;
  --accent:#6250d6;--accent-ink:#5443c8;--accent-soft:#efedfc;--on-accent:#ffffff;
  --st-todo:#8a8b96;--st-dev:#b97f00;--st-review:#2a78d6;--st-you:#6250d6;--st-done:#1a9e6e;--st-rework:#e05a2b;--st-crit:#d03b3b;
  --t-todo:#f0f0f3;--t-dev:#fbf3df;--t-review:#e7f0fb;--t-you:#efedfc;--t-done:#e3f4ec;--t-rework:#fcebe3;--t-crit:#fbe8e8;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 14px 36px rgba(20,20,30,.12);
  --scrim:rgba(22,22,30,.28);
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"Geist Mono","JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0f;--panel:#141418;--side:#0c0c0f;--hover:#1e1e24;--sel:#25233b;--soft:#18181d;
  --line:#25252d;--line-2:#34343e;
  --fg:#ececf1;--fg-2:#a4a5b0;--fg-3:#71727d;
  --accent:#7466e6;--accent-ink:#a397f3;--accent-soft:#25223f;--on-accent:#ffffff;
  --st-todo:#71727d;--st-dev:#c98500;--st-review:#3987e5;--st-you:#9085e9;--st-done:#199e70;--st-rework:#d95926;--st-crit:#e66767;
  --t-todo:#1e1e24;--t-dev:#2a2312;--t-review:#13233a;--t-you:#25223f;--t-done:#10281e;--t-rework:#33190f;--t-crit:#341717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0f;--panel:#141418;--side:#0c0c0f;--hover:#1e1e24;--sel:#25233b;--soft:#18181d;
  --line:#25252d;--line-2:#34343e;
  --fg:#ececf1;--fg-2:#a4a5b0;--fg-3:#71727d;
  --accent:#7466e6;--accent-ink:#a397f3;--accent-soft:#25223f;--on-accent:#ffffff;
  --st-todo:#71727d;--st-dev:#c98500;--st-review:#3987e5;--st-you:#9085e9;--st-done:#199e70;--st-rework:#d95926;--st-crit:#e66767;
  --t-todo:#1e1e24;--t-dev:#2a2312;--t-review:#13233a;--t-you:#25223f;--t-done:#10281e;--t-rework:#33190f;--t-crit:#341717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
svg{flex:none;display:block}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:-.01em}
.muted{color:var(--fg-3)}.dim{color:var(--fg-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;padding:10px 8px 10px 10px;background:var(--side)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;min-height:46px;padding:7px 14px 7px 18px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.topbar h1{font-size:14px;font-weight:600}
.content{flex:1;min-height:0;overflow:auto}
.grow{flex:1}
.icon-btn.menu-btn{display:none}

.ws{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;font-weight:600;width:100%}
.ws:hover{background:var(--hover)}
.logo{width:20px;height:20px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.ws small{display:block;font-weight:400;color:var(--fg-3);font-size:11.5px}
.side-tools{display:flex;gap:6px;margin:6px 0 8px}
.side-search{flex:1;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--fg-3)}
.side-search:hover{border-color:var(--line-2);color:var(--fg-2)}
.kbd{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--fg-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px;background:var(--panel)}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;color:var(--fg-2)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.side-tools .icon-btn{border:1px solid var(--line);background:var(--panel)}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:7px;color:var(--fg-2);font-weight:500}
.nav-item:hover{background:var(--hover);color:var(--fg)}
.nav-item[aria-current="page"]{background:var(--hover);color:var(--fg)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--fg-3)}
.nav-item .count.you{color:var(--accent-ink);font-weight:600}
.nav-item .later{margin-left:auto;font-size:10.5px;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:4px;padding:0 4px}
.side-label{font-size:11.5px;color:var(--fg-3);padding:14px 8px 4px;font-weight:500}
.req-link{font-weight:400}
.req-link span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px 4px 2px}
.conn{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-3);white-space:nowrap;min-width:0}
.conn .mono{overflow:hidden;text-overflow:ellipsis;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--st-done);flex:none}
.dot.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.foot-row{display:flex;align-items:center;gap:4px}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--panel);gap:2px}
.seg button{height:22px;padding:0 7px;white-space:nowrap;display:inline-flex;align-items:center;border-radius:5px;font-size:12px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg);font-weight:600}
.me{display:flex;align-items:center;gap:8px;padding:6px 4px 0;font-size:12px;color:var(--fg-2)}

.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:26px;padding:0 9px;border-radius:7px;color:var(--fg-2);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{background:var(--hover);color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.tabs .c{font-size:11.5px;color:var(--fg-3)}
.search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:7px;width:200px;color:var(--fg-3)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:0;background:none;width:100%;min-width:0;color:var(--fg);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;border:1px solid var(--line);font-size:11.5px;color:var(--fg-2);white-space:nowrap;background:var(--panel)}
.chip.you{background:var(--t-you);border-color:transparent;color:var(--accent-ink);font-weight:600}
.chip.flat{border-color:transparent;background:var(--hover)}
.chip.type{font-family:var(--f-mono);font-size:11px;color:var(--fg-2);background:var(--hover);border-color:transparent}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:8.5px;font-weight:600;background:var(--hover);color:var(--fg-2);border:1px solid var(--line);flex:none;letter-spacing:-.02em}
.av.you{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:9.5px}
.av.none{background:none;border:1px dashed var(--line-2)}
.hx{display:inline-grid;place-items:center;height:16px;min-width:22px;padding:0 3px;border-radius:4px;font:600 9.5px/1 var(--f-mono);color:var(--fg-2);background:var(--hover);border:1px solid var(--line)}
.who{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

.page{padding:22px 28px 40px;max-width:1240px;margin:0 auto}
.home-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:28px;align-items:start}
.stack{display:flex;flex-direction:column;gap:28px;min-width:0}
.greet h2{font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.greet p{color:var(--fg-2);margin-top:4px}
.sec-h{display:flex;align-items:center;gap:8px;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sec-h h3{font-size:13px;font-weight:600}
.sec-h .c{color:var(--fg-3);font-size:12px}
.sec-h a,.sec-h button.link{margin-left:auto;font-size:12px;color:var(--fg-3)}
.sec-h a:hover,.sec-h button.link:hover{color:var(--fg)}
.lrow{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 8px;margin:0 -8px;border-radius:7px}
.lrow:hover,.lrow.is-active{background:var(--hover)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{font-weight:500}
.lrow .t .s{display:block;font-size:12px;color:var(--fg-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow .t .one{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dec-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--t-you);color:var(--accent-ink);flex:none}
.dec-ic.crit{background:var(--t-crit);color:var(--st-crit)}
.go{color:var(--fg-3);display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.lrow:hover .go{color:var(--accent-ink)}

.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:end}
.pstage{display:flex;flex-direction:column;gap:6px;padding:8px 4px 6px;border-radius:7px;min-width:0;text-align:left}
.pstage:hover{background:var(--hover)}
.pbar{height:44px;display:flex;align-items:flex-end}
.pbar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--st-review);opacity:.85;min-height:2px}
.pstage.you .pbar i{background:var(--accent)}
.pstage .n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pstage .l{font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstage .l .you-tag{color:var(--accent-ink);font-weight:600}
.pbase{height:1px;background:var(--line-2);margin-top:-6px}
.pexc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slots{display:flex;gap:6px}
.slot{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.slot.busy{background:var(--soft)}
.slot.unc{border-color:color-mix(in srgb,var(--st-crit) 45%,var(--line));background:var(--t-crit)}
.slot .k{display:flex;align-items:center;gap:6px;font-weight:500}
.slot .s{color:var(--fg-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);margin-top:8px}
.meter .cells{display:flex;gap:3px}
.meter .cells i{width:16px;height:6px;border-radius:2px;background:var(--line-2)}
.meter .cells i.on{background:var(--st-review)}
.gap-g{font-size:11.5px;color:var(--fg-3);font-weight:500;padding:10px 0 2px;display:flex;gap:6px;align-items:center}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600}
.sev.block{color:var(--st-crit)}.sev.adv{color:var(--fg-3)}
.feed{display:flex;flex-direction:column}
.fitem{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.fitem .av{margin-top:1px}
.fitem .t{flex:1;min-width:0;color:var(--fg-2)}
.fitem .t b{color:var(--fg);font-weight:500}
.fitem time{font-size:11.5px;color:var(--fg-3);white-space:nowrap}

.list{padding-bottom:40px}
.ghead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;height:38px;padding:0 20px 0 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.ghead .tg{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;color:var(--fg-3)}
.ghead .tg:hover{background:var(--hover);color:var(--fg)}
.ghead .tg svg{transition:transform .15s}
.ghead.closed .tg svg{transform:rotate(-90deg)}
.ghead a{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ghead .gt{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ghead .gm{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12px;flex:none}
.row{display:flex;align-items:center;gap:10px;height:38px;padding:0 20px 0 22px;border-bottom:1px solid var(--line);min-width:0}
.row:hover{background:var(--hover)}
.row.is-active{background:var(--sel)}
.row .key{width:54px;flex:none;color:var(--fg-3)}
.row .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.row .ttl .txt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .ttl .par{color:var(--fg-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:180px;flex:none}
.row .meta{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12px;flex:none}
.row .due{width:44px;text-align:right}
.row .it{width:26px}
.row.child{padding-left:44px}
.empty{padding:60px 20px;text-align:center;color:var(--fg-2)}
.empty h3{font-size:14px;color:var(--fg);margin-bottom:6px}

.board{display:flex;gap:10px;padding:12px 14px 20px;height:100%;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 244px;display:flex;flex-direction:column;min-height:0;max-height:100%;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.col.drop{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.col-h{display:flex;align-items:center;gap:7px;padding:10px 10px 6px;font-weight:600}
.col-h .c{color:var(--fg-3);font-weight:400}
.col-h .sub{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--fg-3)}
.col-b{display:flex;flex-direction:column;gap:6px;padding:4px 6px 8px;overflow:auto;min-height:60px}
.card{display:flex;flex-direction:column;gap:7px;padding:9px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 1px rgba(0,0,0,.03);cursor:pointer;text-align:left}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.45}
.card .top{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px}
.card .top .av{margin-left:auto}
.card .ct{font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{display:flex;gap:5px;flex-wrap:wrap}
.card .par{font-size:11.5px;color:var(--fg-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card.hold{opacity:.7}

.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:100%}
.d-main{padding:22px 36px 60px;min-width:0;max-width:880px;width:100%;margin:0 auto}
.d-side{border-left:1px solid var(--line);padding:16px 14px 40px;background:var(--soft)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;color:var(--fg-3);font-size:12.5px;flex:1}
.crumbs a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.crumbs a:hover{color:var(--fg)}
.crumbs .cur{color:var(--fg);font-weight:500;white-space:nowrap}
.d-parent{display:inline-flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12.5px;margin-bottom:10px}
.d-parent:hover{color:var(--fg)}
.d-title{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.35;text-wrap:balance;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.d-title .chip{transform:translateY(-2px)}
.d-sub{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12.5px;margin-top:8px;flex-wrap:wrap}
.flow{display:flex;align-items:flex-start;margin:22px 0 4px;overflow-x:auto;padding-bottom:4px}
.fs{flex:1 0 92px;display:flex;flex-direction:column;gap:6px;min-width:92px;position:relative}
.fs .bar{display:flex;align-items:center;gap:0}
.fs .nd{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);background:var(--panel);color:var(--fg-3);flex:none;z-index:1}
.fs .ln{height:2px;background:var(--line-2);flex:1}
.fs.done .nd{background:var(--st-done);border-color:var(--st-done);color:#fff}
.fs.done .ln{background:var(--st-done)}
.fs.cur .nd{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);color:var(--accent)}
.fs.cur.you .nd{background:var(--accent);color:var(--on-accent)}
.fs.bad .nd{border-color:var(--st-rework);color:var(--st-rework);box-shadow:0 0 0 4px var(--t-rework)}
.fs:last-child .ln{visibility:hidden}
.fs .fl{font-size:12px;font-weight:500;padding-right:8px}
.fs .fd{font-size:11.5px;color:var(--fg-3);padding-right:8px}
.fs.cur .fl{color:var(--fg)}
.next{display:flex;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);margin:16px 0 4px;align-items:flex-start}
.next.you{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--t-you)}
.next.crit{border-color:color-mix(in srgb,var(--st-crit) 40%,var(--line));background:var(--t-crit)}
.next .nb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.next .nh{font-weight:600}
.next .nh small{font-weight:400;color:var(--fg-2);margin-left:6px}
.blk{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.blk div{position:relative;padding-left:21px;font-size:12.5px;color:var(--fg-2);line-height:1.5}
.blk div>svg{position:absolute;left:0;top:2px}
.blk div>span,.blk div>code{margin-right:6px}
.blk code{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
