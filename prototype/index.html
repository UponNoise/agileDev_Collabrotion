<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgileDev 原型第 3 轮</title>
<style>
/* Layout: two panes. The left rail answers "which one" (three destinations and a contextual list); the right panel answers "what do you need from me", with the decision bar pinned under the content. */
:root{
  --bg:#f6f6f8;--panel:#ffffff;--hover:#eeeef2;--sel:#e9e7fa;--soft:#f9f9fb;
  --line:#e6e6ec;--line-2:#d3d3dc;
  --fg:#16161b;--fg-2:#54555f;--fg-3:#7d7e89;
  --accent:#6250d6;--accent-ink:#5443c8;--accent-soft:#efedfc;--on-accent:#ffffff;
  --st-todo:#8a8b96;--st-dev:#b97f00;--st-review:#2a78d6;--st-you:#6250d6;--st-done:#1a8f63;--st-rework:#d2521f;--st-crit:#c93434;
  --t-dev:#fbf3df;--t-review:#e7f0fb;--t-you:#efedfc;--t-done:#e3f4ec;--t-rework:#fcebe3;--t-crit:#fbe8e8;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 14px 36px rgba(20,20,30,.14);
  --scrim:rgba(22,22,30,.28);
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --f-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0f;--panel:#141418;--hover:#1e1e24;--sel:#272541;--soft:#18181d;
  --line:#25252d;--line-2:#383842;
  --fg:#ececf1;--fg-2:#a9aab4;--fg-3:#82838e;
  --accent:#7466e6;--accent-ink:#a89df5;--accent-soft:#25223f;--on-accent:#ffffff;
  --st-todo:#82838e;--st-dev:#d09a1a;--st-review:#4a94ee;--st-you:#9589ec;--st-done:#27ab7c;--st-rework:#e66a38;--st-crit:#ea6f6f;
  --t-dev:#2a2312;--t-review:#13233a;--t-you:#25223f;--t-done:#10281e;--t-rework:#33190f;--t-crit:#341717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0f;--panel:#141418;--hover:#1e1e24;--sel:#272541;--soft:#18181d;
  --line:#25252d;--line-2:#383842;
  --fg:#ececf1;--fg-2:#a9aab4;--fg-3:#82838e;
  --accent:#7466e6;--accent-ink:#a89df5;--accent-soft:#25223f;--on-accent:#ffffff;
  --st-todo:#82838e;--st-dev:#d09a1a;--st-review:#4a94ee;--st-you:#9589ec;--st-done:#27ab7c;--st-rework:#e66a38;--st-crit:#ea6f6f;
  --t-dev:#2a2312;--t-review:#13233a;--t-you:#25223f;--t-done:#10281e;--t-rework:#33190f;--t-crit:#341717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
#app{height:100%}
#live{top:0;left:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
svg{flex:none;display:block}
h1,h2,h3,h4,p,ul,ol,dl,dd,blockquote,pre{margin:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:-.01em}
.muted{color:var(--fg-3)}.dim{color:var(--fg-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.grow{flex:1;min-width:0}
.cut{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:304px minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;padding:10px 8px 50px 10px;background:var(--bg)}
.rail-top{display:flex;align-items:center;gap:2px}
.ws{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;border-radius:7px;font-weight:600}
.ws:hover{background:var(--hover)}
.logo{width:20px;height:20px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;color:var(--fg-2);flex:none}
.icon-btn:hover:not([disabled]){background:var(--hover);color:var(--fg)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.menu-btn{display:none}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:7px;color:var(--fg-2);font-weight:500}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--hover);color:var(--fg);font-weight:600}
.nav .n{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ctx{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);margin-top:2px;padding:8px 2px 8px 0;display:flex;flex-direction:column;gap:1px}
.ctx-h{display:flex;gap:6px;padding:6px 8px 4px;font-size:11.5px;color:var(--fg-3);font-weight:500}
.ctx-h+.ent{margin-top:0}
.ent{display:grid;grid-template-columns:18px minmax(0,1fr);gap:1px 9px;padding:8px;border-radius:8px}
.ent:hover{background:var(--hover)}
.ent[aria-current="true"]{background:var(--sel)}
.ent>svg{margin-top:2px;color:var(--fg-3)}
.ent[aria-current="true"]>svg{color:var(--accent-ink)}
.ent.crit>svg{color:var(--st-crit)}
.ent .t{font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ent .s{display:flex;gap:6px;font-size:11.5px;color:var(--fg-3);min-width:0}
.ent .s time{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.req{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:7px;color:var(--fg-2);min-width:0}
.req:hover{background:var(--hover);color:var(--fg)}
.req[aria-current="true"]{background:var(--sel);color:var(--fg);font-weight:500}
.req .you-dot{margin-left:auto}
.you-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.offline{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--t-crit);color:var(--st-crit);font-weight:500;font-size:12.5px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 12px 6px 20px;border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:14px;font-weight:600}
.scroll{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable}
.sheet{max-width:800px;margin:0 auto;padding:26px 36px 48px;display:flex;flex-direction:column;gap:26px}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;color:var(--fg-3);font-size:12.5px;flex:1}
.crumb a{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb a:hover{color:var(--fg)}
.crumb b{font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover:not([disabled]){background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg-2)}
.btn.ghost:hover:not([disabled]){background:var(--hover);color:var(--fg)}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;background:var(--panel)}
.seg button{height:24px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--fg-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--hover);color:var(--fg);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;color:var(--fg-2);white-space:nowrap;background:var(--hover);font-weight:500}
.chip.you{background:var(--t-you);color:var(--accent-ink);font-weight:600}
.chip.rework{background:var(--t-rework);color:var(--st-rework)}
.chip.crit{background:var(--t-crit);color:var(--st-crit)}
.chip.ok{background:var(--t-done);color:var(--st-done)}
.chip.warn{background:var(--t-dev);color:var(--st-dev)}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;width:190px;color:var(--fg-3)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:0;background:none;width:100%;min-width:0;color:var(--fg)}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:600;background:var(--hover);color:var(--fg-2);border:1px solid var(--line);flex:none}
.av.you{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.av.none{background:none;border:1px dashed var(--line-2)}

.dhead{display:flex;flex-direction:column;gap:6px}
.kind{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--accent-ink)}
.kind.crit{color:var(--st-crit)}
.kind.quiet{color:var(--fg-2)}
.dhead h1{font-size:22px;font-weight:600;letter-spacing:-.012em;line-height:1.35;text-wrap:balance}
.by{color:var(--fg-2);font-size:13px}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;min-height:24px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.sec-h .seg{margin-left:auto}
.lead{font-size:14.5px;line-height:1.75}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;padding:11px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.facts span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.md{font-size:14.5px;line-height:1.75;min-width:0;overflow-wrap:anywhere}
.md>*+*{margin-top:10px}
.md h3,.md h4{font-size:15px;font-weight:600;line-height:1.45;margin-top:20px}
.md>h3:first-child,.md>h4:first-child{margin-top:0}
.md h4{font-size:14px}
.md ul,.md ol{padding-left:22px;display:flex;flex-direction:column;gap:4px}
.md li.d1{margin-left:20px}
.md code{font-family:var(--f-mono);font-size:12.5px;padding:1px 5px;border-radius:4px;background:var(--hover)}
.md pre{font-family:var(--f-mono);font-size:12.5px;line-height:1.6;padding:12px 14px;border-radius:8px;background:var(--soft);border:1px solid var(--line);overflow:auto}
.md blockquote{padding-left:12px;border-left:2px solid var(--line-2);color:var(--fg-2)}
.md hr{border:0;border-top:1px solid var(--line)}
.md a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.md .tw{overflow-x:auto}
.md table{border-collapse:collapse;font-size:13.5px;min-width:min(100%,420px)}
.md th,.md td{text-align:left;padding:7px 14px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.md th{font-weight:600;color:var(--fg-2);font-size:12.5px}
.md .noimg{color:var(--fg-3);font-size:13px}
.md .add{background:var(--t-done);box-shadow:-8px 0 0 var(--t-done),8px 0 0 var(--t-done);border-radius:2px}
.md .del{background:var(--t-rework);box-shadow:-8px 0 0 var(--t-rework),8px 0 0 var(--t-rework);border-radius:2px;text-decoration:line-through;color:var(--fg-2)}
.md tr.add,.md tr.del{box-shadow:none}
.md .skip{font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:10px}
.md .skip::before,.md .skip::after{content:"";height:1px;background:var(--line);flex:1}
.quote{display:flex;flex-direction:column;gap:4px;padding:11px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.quote small{color:var(--fg-3);font-size:12px}
.quote p{font-size:14px;line-height:1.65}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:18px minmax(0,1fr);gap:1px 10px;padding:9px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0;padding-top:2px}
.crow>svg{margin-top:3px}
.crow b{font-weight:500;font-size:14px;line-height:1.55}
.crow small{grid-column:2;font-size:13px;line-height:1.6;color:var(--fg-2)}
.dotmark{width:6px;height:6px;border-radius:50%;background:var(--fg-3);margin:9px 6px 0}
.risk{display:flex;flex-direction:column;gap:6px;padding:11px 14px;border:1px solid var(--line);border-radius:9px}
.risk+.risk{margin-top:8px}
.risk.hot{border-color:color-mix(in srgb,var(--st-crit) 45%,var(--line));background:var(--t-crit)}
.risk .rt{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.55}
.risk .rt .chip{margin-top:1px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;font-size:13.5px;line-height:1.6}
.kv dt{color:var(--fg-3)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.frow{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:0 4px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;color:var(--fg)}
.frow:first-child{border-top:0}
.frow:hover{background:var(--hover)}
.frow svg{color:var(--fg-3);transition:transform .12s}
.frow[aria-expanded="true"] svg:first-child{transform:rotate(90deg)}
.frow .grow{overflow-wrap:anywhere}
.frow small{color:var(--fg-3);font-family:var(--f-ui);font-size:12px;white-space:nowrap}
.prev{font-family:var(--f-mono);font-size:12.5px;line-height:1.65;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);overflow:auto;max-height:340px;white-space:pre;tab-size:2}
.prev-n{font-size:12px;color:var(--fg-3);padding:0 4px 8px}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:500}
.lnk:hover{text-decoration:underline;text-underline-offset:2px}
.audit summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-size:12.5px;color:var(--fg-3);border-radius:5px;padding:2px 4px;margin-left:-4px}
.audit summary::-webkit-details-marker{display:none}
.audit summary:hover{color:var(--fg)}
.audit summary svg{transition:transform .12s}
.audit[open] summary svg{transform:rotate(90deg)}
.audit dl{display:grid;grid-template-columns:max-content minmax(0,1fr) 26px;gap:2px 14px;align-items:center;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--soft);font-size:12.5px}
.audit dt{color:var(--fg-3)}
.audit dd{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;min-width:0}
.audit .icon-btn{width:26px;height:26px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.opt+.opt{margin-top:8px}
.opt:hover{border-color:var(--line-2)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input,.chk input{margin:4px 0 0;accent-color:var(--accent);flex:none}
.opt b{font-weight:600;font-size:14px}
.opt small{display:block;font-size:13px;color:var(--fg-2);line-height:1.6}
.opt .sub{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.55;cursor:pointer}

.abar{flex:none;border-top:1px solid var(--line);background:var(--panel)}
.abar.cool{pointer-events:none}
.abar.cool .btn{opacity:.6}
.abar-in{max-width:800px;margin:0 auto;padding:12px 36px;display:flex;flex-direction:column;gap:10px}
.abar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.abar textarea,.abar input[type="text"]{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:9px 11px;font-size:14px;line-height:1.6;outline:0;resize:vertical}
.abar textarea:focus,.abar input[type="text"]:focus{border-color:var(--accent)}
.abar label.sl{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.changed{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--t-dev);color:var(--fg);font-size:13.5px;line-height:1.5}
.changed svg{color:var(--st-dev)}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:17px;background:var(--panel);white-space:nowrap}
.btn .kbd{border-color:color-mix(in srgb,currentColor 35%,transparent);background:none;color:inherit;opacity:.75}
.result{margin:auto;max-width:440px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.result .ok{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--t-done);color:var(--st-done)}
.result h2{font-size:17px;font-weight:600;line-height:1.45}
.result p{color:var(--fg-2);font-size:13.5px}
.center{display:flex;min-height:100%}

.list{padding-bottom:40px}
.ghead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;height:40px;padding:0 20px 0 10px;background:var(--soft);border-bottom:1px solid var(--line)}
.ghead .tg{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--fg-3)}
.ghead .tg:hover{background:var(--hover);color:var(--fg)}
.ghead .tg svg{transition:transform .12s;transform:rotate(90deg)}
.ghead.closed .tg svg{transform:none}
.ghead>a{display:flex;align-items:center;gap:9px;min-width:0;flex:1;font-weight:600}
.ghead>a:hover{color:var(--accent-ink)}
.ghead .gm{color:var(--fg-3);font-size:12px;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;height:40px;padding:0 20px 0 44px;border-bottom:1px solid var(--line);min-width:0}
.row:hover{background:var(--hover)}
.row .key{width:66px;flex:none;color:var(--fg-3)}
.row .st{color:var(--fg-3);font-size:12.5px;flex:none;max-width:38%}
.tree .row{padding:0 4px;height:38px}
.tree .row:last-child{border-bottom:0}
.empty{margin:auto;max-width:420px;padding:60px 24px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:16px;font-weight:600;color:var(--fg)}
.board{display:grid;grid-template-columns:repeat(6,minmax(138px,1fr));gap:8px;padding:12px 14px 20px;min-height:100%;min-width:900px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.col-h{display:flex;align-items:center;gap:7px;padding:4px 4px 6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.col-h span:last-child{color:var(--fg-3);font-weight:400}
.card{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0}
.card:hover{border-color:var(--line-2);background:var(--soft)}
